name: Hourly Winter Ball refresh
on:
  schedule:
    # Every hour at minute 15 during the winter season.
    - cron: '15 * * 1,2,10,11,12 *'
  workflow_dispatch:
    inputs:
      reviewed_corrections:
        description: 'Allow count decreases only after manually verifying an official scoring correction'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/winter-ball.yml']
permissions:
  contents: write
concurrency:
  group: winter-ball-2026
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this season still needs refreshes
        id: season
        run: |
          python3 - <<'PYTHON'
          import datetime, json, os
          d=json.load(open('data/winter/2026.json'))
          today=datetime.datetime.now(datetime.timezone.utc).date()
          active=d['status']!='archived' and datetime.date(2026,10,1)<=today<=datetime.date(2027,2,8)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('active='+str(active).lower()+'\n')
          print('Season active' if active else 'Archived/outside season: skipping all retrieval and build work')
          PYTHON
      - uses: actions/setup-python@v5
        if: steps.season.outputs.active == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.season.outputs.active == 'true'
        with:
          node-version: '24'
      - name: Validate normalization and fallback contracts
        if: steps.season.outputs.active == 'true'
        run: |
          python -m unittest discover -s tests -p 'winter_ball_test.py'
          node --test tests/winter-ball.test.js tests/winter-profiles.test.js tests/winter-existing-profiles.test.js
      - name: Refresh official snapshot (archive guard is inside the updater)
        if: steps.season.outputs.active == 'true'
        env:
          REVIEWED_CORRECTIONS: ${{ inputs.reviewed_corrections || 'false' }}
        run: |
          if [ "$REVIEWED_CORRECTIONS" = true ]; then
            python scripts/winter-ball.py --allow-corrections
          else
            python scripts/winter-ball.py
          fi
      - name: Verify MLB affiliation and refresh prospect profiles
        if: steps.season.outputs.active == 'true'
        run: |
          python scripts/winter-profiles.py
          python scripts/winter-entry-history.py
      - name: Validate saved snapshot and publication assets
        if: steps.season.outputs.active == 'true'
        run: |
          python -m unittest discover -s tests -p 'winter_ball_test.py'
          node --test tests/winter-ball.test.js tests/winter-profiles.test.js tests/winter-existing-profiles.test.js
          npm run build
      - name: Commit validated snapshot
        if: steps.season.outputs.active == 'true'
        run: |
          git add data/winter/2026.json data/winter/profiles-2026.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "$(git log -1 --format=%an -- winter-ball.js)"
          git config user.email "$(git log -1 --format=%ae -- winter-ball.js)"
          git commit -m "Refresh validated winter ball snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Warn on retained stale league data
        if: steps.season.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/winter/2026.json'))
          for warning in d.get('errors',[]): print('::warning::'+warning)
          print(d['status'], d['lastValidatedPublication'])
          PY
